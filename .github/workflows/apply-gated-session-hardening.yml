name: Apply gated-session hardening

on:
  push:
    branches: [feature/platform-foundation]
    paths:
      - ".github/workflows/apply-gated-session-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch gated share session handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('publisher/src/index.ts')
          s = p.read_text()

          pattern = re.compile(r'''interface GateOk \{ ok: true; tokenQuery: string \}\ninterface GateBlock \{ ok: false; resp: Response \}\n\nasync function checkGate\([\s\S]*?\n\}\n\n// ── Cache helpers''')
          replacement = r'''interface GateOk { ok: true; tokenQuery: string }
          interface GateBlock { ok: false; resp: Response }

          function gateCookieName(wrapId: string): string {
            return `brainshare_${wrapId}`;
          }

          function readCookie(req: Request, name: string): string | undefined {
            const header = req.headers.get("cookie") ?? "";
            for (const part of header.split(";")) {
              const [key, ...rest] = part.trim().split("=");
              if (key !== name) continue;
              try { return decodeURIComponent(rest.join("=")); } catch { return rest.join("="); }
            }
            return undefined;
          }

          function gatedSessionRedirect(url: URL, wrapId: string, token: string, exp: number): Response {
            const clean = new URL(url.toString());
            clean.searchParams.delete("t");
            const now = Math.floor(Date.now() / 1000);
            const maxAge = Math.max(0, exp - now);
            const secure = clean.protocol === "https:" ? "; Secure" : "";
            const cookie = `${gateCookieName(wrapId)}=${encodeURIComponent(token)}; Path=/share/${wrapId}; Max-Age=${maxAge}; HttpOnly; SameSite=Lax${secure}`;
            return new Response(null, {
              status: 302,
              headers: {
                location: clean.toString(),
                "set-cookie": cookie,
                "cache-control": "no-store",
              },
            });
          }

          async function checkGate(
            env: Env,
            wrap: WrapData,
            wrapId: string,
            url: URL,
            req: Request,
            exchangeQueryToken = false
          ): Promise<GateOk | GateBlock> {
            if (!wrap.gated) return { ok: true, tokenQuery: "" };

            if (!env.JWT_SECRET) {
              return { ok: false, resp: html(renderGateError("Server misconfigured: JWT_SECRET not set."), 500) };
            }

            const queryToken = url.searchParams.get("t") ?? undefined;
            const cookieToken = readCookie(req, gateCookieName(wrapId));
            const t = queryToken ?? cookieToken;
            if (!t) {
              return {
                ok: false,
                resp: html(renderGateError("This share is gated. A valid access token is required."), 401),
              };
            }
            const claims = await verifyJWT<TokenClaims>(t, env.JWT_SECRET);
            if (!claims) {
              return { ok: false, resp: html(renderGateError("Invalid token signature."), 401) };
            }
            if (claims.sub !== wrapId) {
              return { ok: false, resp: html(renderGateError("Token does not match this share."), 403) };
            }
            const now = Math.floor(Date.now() / 1000);
            if (claims.exp < now) {
              return { ok: false, resp: html(renderGateError("This access token has expired."), 401) };
            }
            if (await env.NOTES.get(`revoked:${claims.jti}`)) {
              return { ok: false, resp: html(renderGateError("This access token has been revoked."), 401) };
            }

            // Browser-facing HTML routes exchange a query token for an HttpOnly
            // session cookie before any shared Cache API representation is read or
            // written. This keeps cached HTML viewer-independent: no recipient JWT
            // is ever embedded in a response that another authorized reader can hit.
            if (queryToken && exchangeQueryToken) {
              return { ok: false, resp: gatedSessionRedirect(url, wrapId, queryToken, claims.exp) };
            }

            // Preserve the existing request-count semantics for gated resources, but
            // do not count the one-time query-token -> cookie redirect above.
            if (claims.max_views) {
              const c = parseInt((await env.NOTES.get(`views:${claims.jti}`)) ?? "0", 10);
              if (c >= claims.max_views) {
                return { ok: false, resp: html(renderGateError("This token has reached its view limit."), 401) };
              }
              await env.NOTES.put(`views:${claims.jti}`, String(c + 1));
            }

            // Rendered representations must never carry the viewer credential.
            return { ok: true, tokenQuery: "" };
          }

          // ── Cache helpers'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
            raise SystemExit(f'expected to replace checkGate once, replaced {n}')

          # All gated routes can authenticate from either the URL token or cookie.
          s = s.replace('checkGate(env, wrap, wrapId, url)', 'checkGate(env, wrap, wrapId, url, req)')
          s = s.replace('checkGate(env, wrap, id, url)', 'checkGate(env, wrap, id, url, req)')

          def exchange_in_section(text: str, start: str, end: str, needle: str) -> str:
            a = text.index(start)
            b = text.index(end, a)
            section = text[a:b]
            if needle not in section:
              raise SystemExit(f'missing gate call in {start}')
            section = section.replace(needle, needle[:-1] + ', true)', 1)
            return text[:a] + section + text[b:]

          needle_wrap = 'checkGate(env, wrap, wrapId, url, req)'
          s = exchange_in_section(s, '// GET /share/:wrapId/c/:ulid — canvas scoped to a wrapper', '// GET /share/:wrapId/:ulid — note scoped', needle_wrap)
          s = exchange_in_section(s, '// GET /share/:wrapId/:ulid — note scoped', '// GET /c/:ulid — standalone canvas', needle_wrap)
          s = exchange_in_section(s, '// GET /share/:id — wrapper landing page', '// GET /:ulid — standalone', 'checkGate(env, wrap, id, url, req)')

          # Cached/rendered HTML and feeds now receive generic links. The renderer
          # retains tokenQuery support for backwards compatibility, but production
          # shared-cache routes intentionally pass an empty string.
          s = s.replace('gate.tokenQuery', '""')
          s = s.replace('JWT token is deliberately excluded so gated wraps share one cache entry.', 'JWT token is excluded from both the cache key and rendered HTML; gated browser sessions use an HttpOnly cookie.')

          if 'gate.tokenQuery' in s:
            raise SystemExit('viewer-specific token propagation remains in publisher source')
          if 'HttpOnly; SameSite=Lax' not in s:
            raise SystemExit('session cookie hardening was not installed')

          p.write_text(s)

          # Add a regression test that makes the representation invariant explicit.
          Path('publisher/test/gated-cache.test.ts').write_text(r'''import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";

          describe("gated shared-cache representation", () => {
            const source = readFileSync(resolve(process.cwd(), "src/index.ts"), "utf8");

            it("exchanges browser query tokens for an HttpOnly session cookie", () => {
              expect(source).toContain("HttpOnly; SameSite=Lax");
              expect(source).toContain("gatedSessionRedirect");
            });

            it("never threads the current viewer token into shared rendered routes", () => {
              expect(source).not.toContain("tokenQuery: gate.tokenQuery");
              expect(source).not.toContain("renderWrapper(env.NOTES, origin, id, wrap, gate.tokenQuery)");
              expect(source).toContain('return { ok: true, tokenQuery: "" }');
            });

            it("still authorizes before Cache API lookup", () => {
              const gate = source.indexOf("const gate = await checkGate", source.indexOf("GET /share/:wrapId/:ulid"));
              const cache = source.indexOf("cache.match(cacheKey)", gate);
              expect(gate).toBeGreaterThan(-1);
              expect(cache).toBeGreaterThan(gate);
            });
          });
          ''')

          # This workflow is deliberately one-shot; remove it in the hardening commit.
          Path('.github/workflows/apply-gated-session-hardening.yml').unlink()
          PY
      - name: Verify publisher
        working-directory: publisher
        run: |
          npm ci
          npx tsc
          npm test
      - name: Commit hardened publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(publisher): keep gated shared-cache HTML credential-free"
          git push origin HEAD:feature/platform-foundation
