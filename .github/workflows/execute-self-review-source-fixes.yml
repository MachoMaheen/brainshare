name: Execute self-review source fixes

on:
  push:
    branches: [feature/platform-foundation]
    paths:
      - ".github/workflows/execute-self-review-source-fixes.yml"

permissions:
  contents: write

jobs:
  fix-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source fixes
        run: bash scripts/apply-self-review-fixes.sh
      - name: Test platform foundation
        run: |
          npm install
          npm test
      - name: Test publisher
        working-directory: publisher
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Test and package VS Code extension
        working-directory: vscode-extension
        run: |
          npm install
          npm run check
          npm run compile
          npm test
          npm run package
      - name: Commit reviewed source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vscode-extension packages/core cli apps/viewer publisher
          git commit -m "fix: resolve self-review blockers and test bundled extension"
          git push origin HEAD:feature/platform-foundation
