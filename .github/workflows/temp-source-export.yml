name: Temporary source export
on:
  push:
    branches: [fix/obsidian-media-publishing]
    paths: ['.github/workflows/temp-source-export.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar czf /tmp/brainshare-src.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
      - uses: actions/upload-artifact@v4
        with:
          name: brainshare-source-for-local-test
          path: /tmp/brainshare-src.tar.gz
          retention-days: 1
