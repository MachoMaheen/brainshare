name: Temporary staging Worker bundle

on:
  push:
    branches: [chore/temporary-staging-worker-bundle]
    paths-ignore:
      - staging-dist/**

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
        working-directory: publisher
      - name: Build Worker without deploying
        run: npx wrangler deploy --config wrangler.smoke.toml --dry-run --outdir .staging-artifacts
        working-directory: publisher
      - name: Save compiled bundle to temporary branch only
        run: |
          mkdir -p staging-dist
          echo "Built files:"
          find publisher/.staging-artifacts -maxdepth 1 -type f -printf '%f\n'
          BUNDLE=$(find publisher/.staging-artifacts -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) | head -n1)
          test -n "$BUNDLE"
          cp "$BUNDLE" staging-dist/worker.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging-dist/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build: temporary deployable Worker bundle'
            git push origin HEAD:chore/temporary-staging-worker-bundle
          fi

  remote-http-smoke:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test deployed staging URL (synthetic fixtures, anonymous requests)
        run: node publisher/test/remote-staging-smoke.mjs
      - name: Record successful staging smoke result on temporary branch
        run: |
          git fetch origin chore/temporary-staging-worker-bundle
          git checkout -B smoke-result origin/chore/temporary-staging-worker-bundle
          mkdir -p staging-dist
          printf '{"status":"passed","test":"remote-http-smoke","commit":"%s"}\n' "$GITHUB_SHA" > staging-dist/remote-smoke-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging-dist/remote-smoke-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record passing remote staging smoke check'
            git push origin HEAD:chore/temporary-staging-worker-bundle
          fi
