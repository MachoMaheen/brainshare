name: Publish VS Code Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shared BrainShare packages
        run: |
          npm install
          npm run build
      - run: npm install
        working-directory: vscode-extension
      - run: npm run check
        working-directory: vscode-extension
      - run: npm run compile
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish -p "$VSCE_PAT"
        working-directory: vscode-extension
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish brainshare-vscode.vsix -p "$OVSX_PAT"
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: brainshare-vscode
          path: vscode-extension/brainshare-vscode.vsix
