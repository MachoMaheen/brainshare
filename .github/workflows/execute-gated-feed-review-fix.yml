name: Execute gated feed review fix

on:
  push:
    branches: [feature/platform-foundation]
    paths:
      - ".github/workflows/execute-gated-feed-review-fix.yml"

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply gated feed fix
        run: bash scripts/fix-gated-feed-review.sh
      - name: Test platform foundation
        run: |
          npm install
          npm test
      - name: Test publisher
        working-directory: publisher
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Commit reviewed feed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publisher
          git commit -m "fix(publisher): preserve secure gated feed subscriptions"
          git push origin HEAD:feature/platform-foundation
