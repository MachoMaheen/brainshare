name: Retry self-review fixes

on:
  push:
    branches: [feature/platform-foundation]
    paths:
      - ".github/workflows/retry-self-review.yml"

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation
      - name: Fix review test variable collision and retrigger
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-self-review-fixes.yml')
          s=p.read_text()
          s=s.replace('secret=path.join(outside,"SECRET.md");await fs.writeFile(secret,"# secret");await fs.symlink(secret,path.join(root,"LEAK.md"))', 'outsideSecret=path.join(outside,"SECRET.md");await fs.writeFile(outsideSecret,"# secret");await fs.symlink(outsideSecret,path.join(root,"LEAK.md"))')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-self-review-fixes.yml
          git commit -m "test: fix viewer symlink regression fixture"
          git push origin HEAD:feature/platform-foundation
